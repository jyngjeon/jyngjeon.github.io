baseURL: https://example.org/
languageCode: en-us
title: Jeyoung Jeon

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
        passthrough:
          delimiters:
            block: [['\[', '\]'], ["$$", "$$"]]
            inline: [['\(', '\)']]
          enable: true
  highlight:
    noClasses: false
  

enableInlineShortcodes: true

menu:
  main:
    - name: Blog
      pageRef: /blog
      weight: 1
    - name: Lists
      pageRef: /lists
      weight: 2

params:
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
  theme:
    default: system
    displayToggle: true
